[tools]
node = "24.20.0"
python = "3.12.15"
"github:Apps2Samsung/Apps2Samsung" = { version = "3.3.1", matching = "Apps2Samsung.Cli-" }

[tasks.build]
run = "npm --prefix app run build"

[tasks."tv:install"]
depends = ["build"]
run = "npm --prefix app run tv:install"

[tasks."electron:install"]
dir = "electron"
run = '''
if [ "$(uname -s)-$(uname -m)" = Darwin-arm64 ]; then
  export npm_config_arch=x64
fi
npm ci
'''

[tasks.electron]
depends = ["build"]
run = "npm --prefix electron start --"

[tasks."app:install"]
dir = "app"
run = "npm ci"

[tasks.lint]
run = "npm --prefix app run lint"

[tasks.format]
run = "npm --prefix app run format"
